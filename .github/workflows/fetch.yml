name: fetch-busybox
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: download busybox-w64u FRP-6075 from frippery.org + verify pinned sha256
        run: |
          curl -fSL --retry 3 --connect-timeout 30 -o busybox.exe \
            "https://frippery.org/files/busybox/busybox-w64u-FRP-6075-g169694ebd.exe"
          echo "6e263d154d8548d1eb936f65d1d8312c80df31c45974e48d6335e4dcc0f4f34c  busybox.exe" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: busybox-w64u-FRP-6075
          path: busybox.exe
          retention-days: 1
